# Publish Chibueze Ikonne's existing React/Vite portfolio to Cloudflare Pages.
# Configure the two encrypted repository secrets before committing this file:
#   CLOUDFLARE_ACCOUNT_ID
#   CLOUDFLARE_API_TOKEN
name: Deploy portfolio to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy website
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and build production website
        run: npm run build

      - name: Ensure the Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          projects=$(npx --yes wrangler@4 pages project list --json)
          if printf '%s' "$projects" | jq -e '.[] | select(.["Project Name"] == "chibuezeikonne")' >/dev/null; then
            echo "Cloudflare Pages project already exists."
          else
            echo "Creating Cloudflare Pages project chibuezeikonne..."
            npx --yes wrangler@4 pages project create chibuezeikonne --production-branch=main
          fi

      - name: Publish website to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=chibuezeikonne --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
